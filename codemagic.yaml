workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        ANDROID_SDK_ROOT: /usr/local/share/android-sdk
      groups:
        - android
    scripts:
      - name: Build Android APK
        script: |
          # ✅ إعطاء صلاحية التنفيذ لـ gradlew
          chmod +x gradlew
          
          # ✅ عرض الإصدارات للتشخيص
          echo "Java version:"
          java -version
          echo "Gradle version:"
          ./gradlew --version
          
          # ✅ بناء التطبيق مع تفاصيل كاملة
          ./gradlew clean assembleDebug --stacktrace --no-daemon
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - your_email@example.com
