workflows:
  # هذا هو العمل الذي سيتم تشغيله سواء اخترت android-workflow أو default-workflow
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      vars:
        GRADLE_WRAPPER_VERSION: "8.0"
    scripts:
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/**.apk

  # هذا هو العمل الاحتياطي في حال اختار السيرفر اسم default-workflow
  default-workflow:
    name: Default Build
    max_build_duration: 60
    environment:
      vars:
        GRADLE_WRAPPER_VERSION: "8.0"
    scripts:
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/**.apk
