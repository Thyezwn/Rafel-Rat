workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      vars:
        GRADLE_WRAPPER_VERSION: "8.0"
    scripts:
      - name: Build Debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/**.apk
    publishing:
      scripts:
        - name: Publish APK to Transfer.sh
          script: |
            echo "Uploading APK to Transfer.sh..."
            curl -s -H "Max-Days: 7" --upload-file app/build/outputs/apk/debug/app-debug.apk https://transfer.sh/app-debug.apk
