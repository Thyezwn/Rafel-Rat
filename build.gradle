buildscript {
    ext {
        compose_ui_version = '1.6.8'  // ✅ تحديث
        compose_compiler_version = '1.5.15'  // ✅ تحديث
    }
}
plugins {
    id 'com.android.application' version '8.2.0' apply false  // ✅ تحديث
    id 'com.android.library' version '8.2.0' apply false  // ✅ تحديث
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false  // ✅ تحديث
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
